# Production-like Compose override for CI / smoke testing.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build
#
# DO NOT use this file for actual production deployments.
# Passwords are hardcoded for CI simplicity.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: testpass

  neo4j:
    environment:
      NEO4J_AUTH: neo4j/testpass

  redis:
    command: redis-server --requirepass testpass

  backend:
    env_file: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://intellicon:testpass@postgres:5432/intellicon
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpass
      REDIS_URL: redis://:testpass@redis:6379/0
      JWT_SECRET_KEY: test-jwt-secret-for-smoke-test
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60
      LLM_PROVIDER: openai
      LLM_API_KEY: sk-test-dummy-key
      AGENT_MAX_ITERATIONS: 10
      SQL_QUERY_TIMEOUT: 30
      SQL_MAX_ROWS: 1000
      CORS_ORIGINS: '["http://localhost:3000"]'
      SEED_ADMIN_PASSWORD: admin123
      SEED_INVESTIGATOR_PASSWORD: investigator123
      SEED_SUPERVISOR_PASSWORD: supervisor123
    volumes: []

  frontend:
    volumes: []

  caddy:
    environment:
      - DOMAIN=localhost
    volumes: []
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics:
    ports:
      - "8001:8001"
    env_file: []
    environment:
      DATABASE_URL: postgresql://intellicon:testpass@postgres:5432/intellicon
      REDIS_URL: redis://:testpass@redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r = urllib.request.urlopen('http://localhost:8001/health'); exit(0 if r.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
