[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres-err.log
priority=10

[program:neo4j]
command=neo4j console
user=neo4j
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/neo4j.log
stderr_logfile=/var/log/supervisor/neo4j-err.log
priority=20
startsecs=15

[program:redis]
command=redis-server --requirepass %(ENV_REDIS_PASSWORD)s --dir /var/run/redis
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis-err.log
priority=30

[program:backend]
command=python3.11 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/app/backend
environment=DATABASE_URL="postgresql://%(ENV_POSTGRES_USER)s:%(ENV_POSTGRES_PASSWORD)s@localhost:5432/%(ENV_POSTGRES_DB)s",NEO4J_URI="bolt://localhost:7687",NEO4J_USER="%(ENV_NEO4J_USER)s",NEO4J_PASSWORD="%(ENV_NEO4J_PASSWORD)s",REDIS_URL="redis://:%(ENV_REDIS_PASSWORD)s@localhost:6379/0",ENVIRONMENT="%(ENV_ENVIRONMENT)s"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend-err.log
priority=40
startsecs=10

[program:analytics]
command=python3.11 -m uvicorn app.main:app --host 0.0.0.0 --port 8001
directory=/app/analytics
environment=DATABASE_URL="postgresql://%(ENV_POSTGRES_USER)s:%(ENV_POSTGRES_PASSWORD)s@localhost:5432/%(ENV_POSTGRES_DB)s",REDIS_URL="redis://:%(ENV_REDIS_PASSWORD)s@localhost:6379/0"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/analytics.log
stderr_logfile=/var/log/supervisor/analytics-err.log
priority=50
startsecs=10

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/caddy.log
stderr_logfile=/var/log/supervisor/caddy-err.log
priority=60
