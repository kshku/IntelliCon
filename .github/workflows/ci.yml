name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff check
        run: ruff check backend/
      - name: Ruff format check
        run: ruff format --check backend/
      - name: Mypy
        run: mypy backend/app/
        continue-on-error: true

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: intellicon_test
          POSTGRES_USER: intellicon
          POSTGRES_PASSWORD: intellicon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intellicon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql://intellicon:intellicon@localhost:5432/intellicon_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret
        run: pytest backend/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
      - run: npm run test
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: intellicon-backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: intellicon-frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build analytics
        uses: docker/build-push-action@v6
        with:
          context: ./analytics
          push: false
          tags: intellicon-analytics
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --tail=500 > docker-logs.txt 2>&1
      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-test-logs
          path: docker-logs.txt
          retention-days: 7
